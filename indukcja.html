<!doctype html><html><head><meta charset=utf8><meta name="robots" content="noindex,nofollow"><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Indukcja</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=STIX+Two+Text:ital,wght@0,400;1,400;1,500&display=swap">
<style>
/* Layout: induction bench. Stage with scene chips + HUD on top, transport and timeline below,
   control panel on the right, live formulas and stacked charts underneath. */
:root{
  --bg:#E7EAF2; --surface:#F8F9FC; --paper:#FCFCFE; --sunk:#EEF0F6;
  --ink:#141A2E; --ink-2:#4A5270; --ink-3:#80879F; --line:#D2D6E2;
  --grid:#E8EAF2; --grid-major:#CFD4E2;
  --pos:#E41C55; --neg:#2F7FE0; --cu:#C77A2A; --violet:#6A5CFF;
  --scope:#0C121B;
  --on-accent:#FFFFFF; --shadow:0 1px 0 rgba(20,26,46,.04), 0 8px 24px -12px rgba(20,26,46,.18);
  --f-display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body:"Instrument Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --f-math:"STIX Two Text", "Cambria Math", Cambria, "Times New Roman", serif;
  --r:12px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#080B14; --surface:#0F131E; --paper:#0C101A; --sunk:#151A27;
    --ink:#E6E9F3; --ink-2:#A6ADC4; --ink-3:#6E7690; --line:#242A3B;
    --grid:#121725; --grid-major:#1F2639;
    --pos:#EE3A68; --neg:#4E9DFF; --cu:#BD7A2A; --violet:#8A7FFF;
    --scope:#060A10;
    --shadow:0 1px 0 rgba(0,0,0,.2), 0 10px 30px -14px rgba(0,0,0,.7);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#080B14; --surface:#0F131E; --paper:#0C101A; --sunk:#151A27;
  --ink:#E6E9F3; --ink-2:#A6ADC4; --ink-3:#6E7690; --line:#242A3B;
  --grid:#121725; --grid-major:#1F2639;
  --pos:#EE3A68; --neg:#4E9DFF; --cu:#BD7A2A; --violet:#8A7FFF;
  --scope:#060A10;
  --shadow:0 1px 0 rgba(0,0,0,.2), 0 10px 30px -14px rgba(0,0,0,.7);
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg); color:var(--ink); font-family:var(--f-body); font-size:15px; line-height:1.5; margin:0;
  padding-left:max(16px, env(safe-area-inset-left, 0px)); padding-right:max(16px, env(safe-area-inset-right, 0px));}
.app{max-width:1440px; margin:0 auto; padding-block:20px 48px; display:flex; flex-direction:column; gap:20px}
button{font:inherit; color:inherit}
[hidden]{display:none !important}
:focus-visible{outline:2px solid var(--neg); outline-offset:2px}

/* Header */
.top{display:flex; align-items:flex-end; justify-content:space-between; gap:16px; flex-wrap:wrap}
.brand{display:flex; flex-direction:column; gap:4px; min-width:0}
.eyebrow{font-family:var(--f-mono); font-size:11.5px; letter-spacing:.12em; text-transform:uppercase; color:var(--ink-3)}
.brand h1{margin:0; font-family:var(--f-display); font-weight:800; font-size:clamp(32px, 5vw, 56px); line-height:.95; letter-spacing:-.025em; text-wrap:balance; display:flex; align-items:center; gap:.25em}
.brand h1 svg{width:1.05em; height:.62em; flex:none}
.lede{margin:6px 0 0; color:var(--ink-2); max-width:66ch}
.lang{display:inline-flex; border:1px solid var(--line); border-radius:999px; padding:3px; background:var(--surface)}
.lang button{border:0; background:none; padding:4px 12px; border-radius:999px; font-family:var(--f-mono); font-size:12px; cursor:pointer; color:var(--ink-2)}
.lang button[aria-pressed="true"]{background:var(--ink); color:var(--paper)}

/* Main grid */
.main{display:grid; grid-template-columns:minmax(0,1fr) 340px; gap:20px; align-items:start}
.leftcol{display:flex; flex-direction:column; gap:20px; min-width:0}
.card{background:var(--surface); border:1px solid var(--line); border-radius:var(--r); box-shadow:var(--shadow)}

/* Stage */
.stage{display:flex; flex-direction:column; overflow:hidden; background:var(--surface)}
.strip{display:flex; flex-direction:column; gap:8px; padding:10px 14px; border-bottom:1px solid var(--line)}
.strip-top{display:flex; justify-content:space-between; align-items:center; gap:8px 16px; flex-wrap:wrap}
.scenes{display:flex; gap:6px; flex-wrap:wrap}
.scene{display:inline-flex; align-items:center; gap:8px; border:1px solid var(--line); background:var(--paper); border-radius:10px; padding:6px 12px 6px 8px; cursor:pointer; font-size:14px; font-weight:600; color:var(--ink-2)}
.scene svg{width:26px; height:20px; flex:none}
.scene[aria-pressed="true"]{border-color:var(--ink); color:var(--ink); box-shadow:inset 0 0 0 1px var(--ink); background:var(--surface)}
.hud{display:flex; gap:4px 18px; flex-wrap:wrap; margin:0; font-family:var(--f-mono); font-variant-numeric:tabular-nums}
.hud div{display:flex; align-items:baseline; gap:6px}
.hud dt{font-family:var(--f-math); font-style:italic; font-size:16px; color:var(--ink-3)}
.hud dt sub{font-size:11px}
.hud dd{margin:0; font-size:13.5px; min-width:8.6ch; color:var(--ink)}
.state{font-family:var(--f-mono); font-size:11px; letter-spacing:.08em; text-transform:uppercase; padding:3px 9px; border-radius:999px; border:1px solid var(--line); color:var(--ink-2); white-space:nowrap}
.state[data-s="run"]{border-color:var(--pos); color:var(--pos)}
.state[data-s="pause"]{border-color:var(--cu); color:var(--cu)}
.state[data-s="live"]{border-color:var(--violet); color:var(--violet)}
.state[data-s="end"]{background:var(--ink); border-color:var(--ink); color:var(--paper)}
.canvas-box{position:relative; height:clamp(360px, 60vh, 660px); background:var(--paper)}
.canvas-box canvas{position:absolute; inset:0; width:100%; height:100%; display:block; touch-action:none}
.callout{position:absolute; left:12px; top:12px; max-width:min(360px, 62%); background:color-mix(in srgb, var(--surface) 88%, transparent); border:1px solid var(--line); border-radius:10px; padding:8px 11px; font-size:13px; line-height:1.4; color:var(--ink-2); pointer-events:none; backdrop-filter:blur(4px); -webkit-backdrop-filter:blur(4px)}
.callout b{display:block; font-family:var(--f-mono); font-size:10.5px; letter-spacing:.12em; text-transform:uppercase; color:var(--violet); font-weight:500; margin-bottom:2px}
.callout .l2{color:var(--ink); font-weight:600; margin-top:2px}
.stage:fullscreen{border-radius:0}
.stage:fullscreen .canvas-box{height:auto; flex:1}

.scrub{display:flex; align-items:center; gap:10px; padding:8px 14px; border-top:1px solid var(--line)}
.scrub input[type=range]{flex:1; min-width:0; --c:var(--pos)}
.scrub .time{font-family:var(--f-mono); font-size:12.5px; font-variant-numeric:tabular-nums; color:var(--ink-2); white-space:nowrap; min-width:13ch; text-align:right}
.icon-btn{width:34px; height:34px; border-radius:50%; border:1px solid var(--line); background:var(--paper); display:inline-flex; align-items:center; justify-content:center; cursor:pointer; color:var(--ink); flex:none; padding:0}
.icon-btn:hover{border-color:var(--ink-3)}
.icon-btn:disabled{opacity:.35; cursor:default}
.icon-btn svg{width:14px; height:14px}
.icon-btn.main{width:40px; height:40px; background:var(--ink); color:var(--paper); border-color:var(--ink)}
.icon-btn.main svg{width:16px; height:16px}
.bar{display:flex; align-items:center; gap:10px 14px; flex-wrap:wrap; padding:10px 14px; border-top:1px solid var(--line)}
.btn{display:inline-flex; align-items:center; gap:6px; border:1px solid var(--line); background:var(--paper); padding:7px 12px; border-radius:999px; cursor:pointer; font-size:13.5px; color:var(--ink)}
.btn:hover{border-color:var(--ink-3)}
.btn svg{width:15px; height:15px}
.btn.accent{background:var(--pos); border-color:var(--pos); color:var(--on-accent); font-family:var(--f-display); font-weight:700; font-size:15px; padding:8px 16px 8px 13px; box-shadow:0 6px 18px -8px var(--pos)}
.seg{display:inline-flex; align-items:center; gap:2px; border:1px solid var(--line); border-radius:999px; padding:2px; background:var(--paper)}
.seg .lbl{font-size:12px; color:var(--ink-3); padding:0 6px 0 8px}
.seg button{border:0; background:none; padding:4px 9px; border-radius:999px; font-family:var(--f-mono); font-size:12px; cursor:pointer; color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--ink); color:var(--paper)}
.toggles{display:flex; gap:6px; flex-wrap:wrap}
.tg{border:1px solid var(--line); background:transparent; padding:5px 11px; border-radius:999px; font-size:13px; cursor:pointer; color:var(--ink-2)}
.tg[aria-pressed="true"]{background:var(--sunk); color:var(--ink); border-color:var(--ink-3)}
.tg[aria-pressed="true"]::before{content:""; display:inline-block; width:6px; height:6px; border-radius:50%; background:var(--violet); margin-right:7px; vertical-align:middle; transform:translateY(-1px)}
.bar .spacer{flex:1}
.keys{padding:0 14px 10px; font-size:12px; color:var(--ink-3)}
.keys kbd{font-family:var(--f-mono); font-size:10.5px; border:1px solid var(--line); border-bottom-width:2px; border-radius:4px; padding:0 4px; background:var(--paper); color:var(--ink-2)}

/* Results */
.results{padding:16px 18px; display:flex; flex-direction:column; gap:14px}
.sec-h{display:flex; align-items:baseline; justify-content:space-between; gap:12px; flex-wrap:wrap}
.sec-h h2{margin:0; font-family:var(--f-display); font-weight:700; font-size:21px; letter-spacing:-.01em}
.sec-h p{margin:0; color:var(--ink-3); font-size:13px; max-width:70ch}
.tbl-wrap{overflow-x:auto}
table.res{width:100%; border-collapse:collapse; font-variant-numeric:tabular-nums; min-width:440px}
.res th, .res td{padding:8px 10px; text-align:right; border-bottom:1px solid var(--line); white-space:nowrap}
.res thead th{font-size:11.5px; letter-spacing:.08em; text-transform:uppercase; color:var(--ink-3); font-weight:500}
.res tbody th{text-align:left; font-weight:500; color:var(--ink-2)}
.res tbody th i{font-family:var(--f-math); font-size:16px; color:var(--ink)}
.res td{font-family:var(--f-mono); font-size:14px}
.res td.muted{color:var(--ink-3)}
.res tr:last-child th, .res tr:last-child td{border-bottom:0}
.opt{display:flex; gap:8px 20px; align-items:center; flex-wrap:wrap; padding:10px 12px; border-radius:10px; background:var(--sunk)}
.opt .val{font-family:var(--f-mono); font-size:14px; display:inline-flex; align-items:baseline; gap:8px}
.opt .val small{font-family:var(--f-body); color:var(--ink-3); font-size:12.5px}
.opt .val i{font-family:var(--f-math); font-size:16px}

/* Panel */
.panel{padding:6px 16px 16px; display:flex; flex-direction:column; position:sticky; top:calc(env(safe-area-inset-top, 0px) + 12px)}
.grp{border:0; margin:0; padding:14px 0 6px; border-top:1px solid var(--line); display:flex; flex-direction:column; gap:12px; min-width:0}
.grp.first{border-top:0}
.grp h3{margin:0; font-family:var(--f-mono); font-weight:500; font-size:11.5px; letter-spacing:.12em; text-transform:uppercase; color:var(--ink-3)}
.ctl{display:flex; flex-direction:column; gap:2px}
.ctl-head{display:flex; justify-content:space-between; align-items:baseline; gap:8px}
.ctl label{font-size:13.5px; color:var(--ink-2)}
.ctl label i, .switch i, .pills i{font-family:var(--f-math); font-size:16px; color:var(--ink)}
.ctl output{font-family:var(--f-mono); font-size:13.5px; font-variant-numeric:tabular-nums; color:var(--ink); white-space:nowrap}
.hint{font-size:12px; color:var(--ink-3); margin:0}
input[type=range]{-webkit-appearance:none; appearance:none; width:100%; height:24px; background:transparent; margin:0; cursor:pointer; --p:50%}
input[type=range]:disabled{opacity:.4; cursor:default}
input[type=range]::-webkit-slider-runnable-track{height:4px; border-radius:2px; background:linear-gradient(to right, var(--c, var(--ink)) var(--p), var(--line) var(--p))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none; width:18px; height:18px; border-radius:50%; background:var(--paper); border:2.5px solid var(--c, var(--ink)); margin-top:-7px; box-shadow:0 1px 3px rgba(0,0,0,.2)}
input[type=range]::-moz-range-track{height:4px; border-radius:2px; background:var(--line)}
input[type=range]::-moz-range-progress{height:4px; border-radius:2px; background:var(--c, var(--ink))}
input[type=range]::-moz-range-thumb{width:13px; height:13px; border-radius:50%; background:var(--paper); border:2.5px solid var(--c, var(--ink))}
.chips{display:flex; flex-wrap:wrap; gap:6px}
.chip{border:1px solid var(--line); background:var(--paper); border-radius:8px; padding:5px 10px; font-size:13px; cursor:pointer; color:var(--ink-2); display:inline-flex; flex-direction:column; align-items:flex-start; line-height:1.2}
.chip small{font-family:var(--f-mono); font-size:10.5px; color:var(--ink-3)}
.chip[aria-pressed="true"]{border-color:var(--ink); color:var(--ink); box-shadow:inset 0 0 0 1px var(--ink)}
.switch{display:flex; align-items:center; gap:10px; cursor:pointer; font-size:14px; font-weight:500; position:relative}
.switch input{position:absolute; opacity:0; width:1px; height:1px}
.switch .sw{width:38px; height:22px; border-radius:999px; background:var(--line); position:relative; transition:background .15s; flex:none}
.switch .sw::after{content:""; position:absolute; top:3px; left:3px; width:16px; height:16px; border-radius:50%; background:var(--paper); transition:transform .15s; box-shadow:0 1px 2px rgba(0,0,0,.25)}
.switch input:checked + .sw{background:var(--pos)}
.switch input:checked + .sw::after{transform:translateX(16px)}
.switch input:focus-visible + .sw{outline:2px solid var(--neg); outline-offset:2px}
.pills{display:grid; grid-template-columns:repeat(3, minmax(0,1fr)); gap:6px}
.pill{background:var(--sunk); border-radius:8px; padding:6px 8px; display:flex; flex-direction:column; gap:1px; min-width:0}
.pill small{font-size:10.5px; color:var(--ink-3); line-height:1.25}
.pill span{font-family:var(--f-mono); font-size:12.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}

/* Lower */
.lower{display:grid; grid-template-columns:minmax(0,1.3fr) minmax(0,1fr); gap:20px; align-items:start}
.formulas{padding:16px 18px 18px; display:flex; flex-direction:column; gap:14px; min-width:0}
.fgrid{display:grid; grid-template-columns:repeat(2, minmax(0,1fr)); gap:10px}
.fcard{background:var(--paper); border:1px solid var(--line); border-radius:10px; padding:12px 14px; display:flex; flex-direction:column; gap:8px; min-width:0}
.fcard.wide{grid-column:1 / -1}
.fcard.lenz{border-color:color-mix(in srgb, var(--violet) 45%, var(--line)); background:color-mix(in srgb, var(--violet) 6%, var(--paper))}
.fcard h4{margin:0; font-size:12px; font-weight:600; letter-spacing:.06em; text-transform:uppercase; color:var(--ink-3)}
.eq{font-family:var(--f-math); font-size:18px; line-height:1.9; overflow-x:auto; scrollbar-width:thin; scrollbar-color:var(--line) transparent; overflow-y:hidden; white-space:nowrap; padding-bottom:2px; color:var(--ink)}
.eq.num{font-size:16px; color:var(--ink-2)}
.eq i{font-style:italic}
.eq sub{font-size:.68em; font-style:normal}
.eq sup{font-size:.68em}
.eq .r{color:var(--pos); font-family:var(--f-mono); font-size:15px; font-weight:500; font-style:normal}
.fr{display:inline-flex; flex-direction:column; vertical-align:middle; text-align:center; margin:0 .12em; line-height:1.25}
.fr > span:first-child{padding:0 .3em .08em; border-bottom:1px solid currentColor}
.fr > span:last-child{padding:.08em .3em 0}
.int{font-size:1.35em; vertical-align:-.12em; margin-right:.05em}
.fnote{font-size:12.5px; color:var(--ink-3); margin:0}
.fnote i{font-family:var(--f-math); font-size:14px}
.ltext{font-size:14.5px; color:var(--ink); margin:0; line-height:1.5}
.ltext b{color:var(--violet)}

.charts{padding:16px 18px 18px; display:flex; flex-direction:column; gap:12px; min-width:0; position:sticky; top:calc(env(safe-area-inset-top, 0px) + 12px)}
.tabs{display:inline-flex; flex-wrap:wrap; gap:2px; border:1px solid var(--line); border-radius:18px; padding:2px; background:var(--paper); align-self:flex-start}
.tabs button{border:0; background:none; padding:5px 12px; border-radius:999px; font-size:13px; cursor:pointer; color:var(--ink-2)}
.tabs button[aria-selected="true"]{background:var(--ink); color:var(--paper)}
.clegend{display:flex; gap:6px 14px; flex-wrap:wrap; font-size:12.5px; color:var(--ink-2)}
.clegend span{display:inline-flex; align-items:center; gap:6px}
.sw-line{display:inline-block; width:20px; height:0; border-top:2.5px solid var(--ink)}
.chart-box{position:relative; height:320px}
.chart-box canvas{position:absolute; inset:0; width:100%; height:100%; display:block; touch-action:pan-y}
.tip{position:absolute; pointer-events:none; background:var(--ink); color:var(--paper); border-radius:8px; padding:7px 10px; font-family:var(--f-mono); font-size:12px; line-height:1.5; white-space:nowrap; transform:translate(-50%, calc(-100% - 12px)); box-shadow:0 6px 18px -6px rgba(0,0,0,.4); z-index:2}
.tip .row{display:flex; align-items:center; gap:7px}
.tip .k{width:10px; height:3px; border-radius:2px}
.cnote{font-size:12.5px; color:var(--ink-3); margin:0}
.cnote i{font-family:var(--f-math); font-size:14px}

@media (max-width: 1080px){
  .main{grid-template-columns:minmax(0,1fr)}
  .panel{position:static; display:grid; grid-template-columns:repeat(auto-fit, minmax(280px, 1fr)); column-gap:24px; padding:6px 16px 12px}
  .grp.first{border-top:1px solid var(--line)}
  .lower{grid-template-columns:minmax(0,1fr)}
  .charts{position:static}
}
@media (max-width: 640px){
  .brand h1{font-size:27px}
  .brand h1 svg{display:none}
  .canvas-box{height:auto; display:flex; flex-direction:column}
  .canvas-box canvas{position:relative; inset:auto; width:100%; height:auto; aspect-ratio:1 / 1.08}
  .callout{position:static; max-width:none; border-radius:0; border-width:1px 0 0; backdrop-filter:none; -webkit-backdrop-filter:none; background:var(--surface)}
  .stage:fullscreen .canvas-box canvas{flex:1; aspect-ratio:auto; min-height:0}
  .fgrid{grid-template-columns:minmax(0,1fr)}
  .hud{gap:2px 12px}
  .hud dd{min-width:7.6ch; font-size:12.5px}
  .bar .spacer{display:none}
  .scene{font-size:13px; padding:5px 9px 5px 6px}
  .scene svg{width:20px; height:16px}
  .callout{font-size:12.5px; padding:8px 14px}
  .chart-box{height:280px}
}
@media (prefers-reduced-motion: reduce){
  .switch .sw, .switch .sw::after{transition:none}
}
</style>

<div class="app"><a class="home-link" href="./" data-pl="← Strona główna" data-en="← Home">← Strona główna</a>
<style>.home-link{align-self:flex-start;display:inline-flex;align-items:center;gap:6px;font-family:var(--f-mono,ui-monospace,monospace);font-size:12.5px;letter-spacing:.04em;color:var(--ink-2,#465768);text-decoration:none;border:1px solid var(--line,#CCD5DE);background:var(--surface,#F7F9FB);border-radius:999px;padding:5px 13px;margin-bottom:-8px;transition:border-color .15s,color .15s}.home-link:hover{color:var(--ink,#12202C);border-color:var(--ink-3,#7C8B9A)}.home-link:focus-visible{outline:2px solid var(--vac,#2F7FE0);outline-offset:2px}</style>
<script>(function(){var K=['teaching-lang','rzut-lang','bryla-lang','orbity-lang','rezonans-lang','doppler-lang','gaz-lang','pole-lang','lawa-lang','szczeliny-lang','sr-lang','wahadlo-lang','rozpad-lang','indukcja-lang'];
function cur(){var b=document.querySelector('.lang button[aria-pressed="true"]');return b&&b.dataset.lang==='en'?'en':'pl';}
function upd(){var a=document.querySelector('.home-link');if(a)a.textContent=a.getAttribute('data-'+cur());}

/* ---------- number formatting ---------- */
const nfCache = {};
function fmt(x, dec = 2) {
  if (!isFinite(x)) return '∞';
  if (Math.abs(x) < 0.5 * Math.pow(10, -dec)) x = 0;
  const key = lang + dec;
  if (!nfCache[key]) nfCache[key] = new Intl.NumberFormat(lang === 'pl' ? 'pl-PL' : 'en-US', { minimumFractionDigits: dec, maximumFractionDigits: dec });
  return nfCache[key].format(x).replace('-', '−');
}
const autoDec = (x) => { const a = Math.abs(x); return a >= 100 ? 0 : a >= 10 ? 1 : 2; };
const fa = (x) => fmt(x, autoDec(x));
const PFX = [[1e9, 'G'], [1e6, 'M'], [1e3, 'k'], [1, ''], [1e-3, 'm'], [1e-6, 'µ'], [1e-9, 'n']];
function pickPfx(ax) { for (const p of PFX) if (ax >= p[0] * 0.9995) return p; return PFX[PFX.length - 1]; }
// SI value with an automatic prefix (3 significant digits)
function fsi(x, unit, ref) {
  if (!isFinite(x)) return '—';
  const ax = Math.abs(ref != null ? ref : x);
  if (ax < 1e-12) return `${fmt(0, 0)} ${unit}`;
  const [f, p] = pickPfx(ax), v = x / f;
  const av = Math.abs(ref != null ? ref / f : v);
  return `${fmt(v, av >= 100 ? 0 : av >= 10 ? 1 : 2)} ${p}${unit}`;
}
function niceUp(x) {
  if (!(x > 0)) return 1;
  const p = Math.pow(10, Math.floor(Math.log10(x))), f = x / p;
  return (f <= 1 ? 1 : f <= 2 ? 2 : f <= 5 ? 5 : 10) * p;
}
function niceStep(range, target) {
  const raw = range / target, p = Math.pow(10, Math.floor(Math.log10(raw))), f = raw / p;
  return (f < 1.5 ? 1 : f < 3.5 ? 2 : f < 7.5 ? 5 : 10) * p;
}
const roundSig = (v, n = 2) => { if (v === 0) return 0; const p = Math.pow(10, n - 1 - Math.floor(Math.log10(Math.abs(v)))); return Math.round(v * p) / p; };

  else if (k === 'rod') {
    const v = S.liveV || 0;
    if (Math.abs(v) > 0.08) { S.rmode = 'release'; S.rodStart = { x0: S.liveX, v0: clamp(v, -12, 12) }; rebuild(); }
  }
}
cv.addEventListener('pointerup', endDrag);
cv.addEventListener('pointercancel', endDrag);

/* ---------- main loop ---------- */
function advance(dt) {
  if (RUN.live) {
    if (S.paused) return;
    // hand-driven: follow the pointer target, velocity from a short low-pass filter
    const prev = S.liveX ?? 0;
    let x = prev;
    if (S.drag && S.dragTarget != null) x = S.dragTarget;
    const vRaw = dt > 0 ? (x - prev) / dt : 0;
    S.liveV = (S.liveV || 0) + (vRaw - (S.liveV || 0)) * (1 - Math.exp(-dt / 0.06));
    if (!S.drag) S.liveV *= Math.exp(-dt / 0.03);
    if (Math.abs(S.liveV) < 1e-4) S.liveV = 0;
    S.liveX = x;
    const smp = liveSample(x, S.liveV, S.Qlive || 0);
    S.Qlive = (S.Qlive || 0) + smp.P * dt; smp.Q = S.Qlive; if (smp.Etot != null) smp.Etot = smp.Ek + smp.Q;
    S.t += dt; livePush(RUN, S.t, smp);
    if (S.scene === 'magnet') { const I = Math.abs(smp.I); if (I > S.Ifs) S.Ifs = niceUp(I); }
    else { const I = Math.abs(smp.I); if (I > S.Ifs) S.Ifs = niceUp(I); }
    return;
  }
  if (S.paused || S.hold != null) return;
  S.t += dt * S.speed;
  if (S.t >= RUN.T) {
    if (RUN.loop) S.t %= RUN.T;
    else { S.t = RUN.T; S.paused = true; S.ended = true; }
  }
}
function stepNeedle(dt, I) {
  const target = I / S.Ifs;
  if (reduceMotion || dt <= 0) { S.needle = target; S.needleV = 0; return; }
  const w0 = TAU * 2.4, z = 0.55;
  const steps = Math.max(1, Math.ceil(dt / 0.004)), h = dt / steps;
  for (let i = 0; i < steps; i++) { const a = -w0 * w0 * (S.needle - target) - 2 * z * w0 * S.needleV; S.needleV += a * h; S.needle += S.needleV * h; }
}
function snapNeedle() { const q = curSample(); S.needle = (S.scene === 'magnet' ? q.I : 0) / S.Ifs; S.needleV = 0; }
function drawAll() {
  const q = curSample();
  if (S.scene === 'magnet') drawMagnet(q); else if (S.scene === 'rod') drawRod(q); else drawGen(q);
  drawChart();
  return q;
}
function refreshText(force) {
  const q = curSample();
  updateHud(q); setState(); updateScrub(); updateCallout(q);
  if (force) { updateResults(q); updateFormulas(q); }
}
function frame(now) {
  const dt = Math.min(0.05, Math.max(0, (now - lastT) / 1000)); lastT = now;
  const playing = RUN.live ? !S.paused : !S.paused && S.hold == null;
  advance(dt);
  const q = curSample();
  // smooth rails length change in the rod scene
  if (S.scene === 'rod' && Math.abs(S.rodLrView - S.rodLr) > 1e-4) { S.rodLrView += (S.rodLr - S.rodLrView) * (reduceMotion ? 1 : 1 - Math.exp(-dt * 6)); dirty = true; }
  if (playing) {
    const sp = RUN.live ? 1 : S.speed;
    if (S.scene === 'magnet') { stepNeedle(dt * (RUN.live ? 1 : S.speed), q.I); S.qoff += 150 * clamp(q.I / S.Ifs, -1.2, 1.2) * dt * Math.min(1, sp * 1.5); }
    else if (S.scene === 'rod') S.qoff += 130 * clamp(q.I / S.Ifs, -1.2, 1.2) * dt * Math.min(1, sp * 1.5);
    else { S.qoff += 130 * clamp(q.emf / P.g.R / S.Ifs, -1.2, 1.2) * dt * Math.min(1, sp * 1.5); S.qoff2 += 130 * clamp(q.out / P.g.R / S.Ifs, -1.2, 1.2) * dt * Math.min(1, sp * 1.5); }
    dirty = true; chartDirty = true;
  } else if (S.scene === 'magnet' && Math.abs(S.needleV) > 1e-3) { stepNeedle(dt, q.I); dirty = true; }
  if (dirty) {
    if (S.scene === 'magnet') drawMagnet(q); else if (S.scene === 'rod') drawRod(q); else drawGen(q);
    dirty = false;
  }
  if (chartDirty) { drawChart(); chartDirty = false; }
  textTimer += dt;
  updateHud(q); setState(); updateScrub(); updateCallout(q);
  if (playing && textTimer > 0.15) { updateResults(q); updateFormulas(q); textTimer = 0; }
  requestAnimationFrame(frame);
}

/* ---------- wiring ---------- */
function bindPanel() {
  for (const id of Object.keys(SL)) {
    const el = $('#' + id); if (!el) continue;
    el.addEventListener('input', () => {
      delete exact[id];
      if (id === 'rV') S.rodStart = null;
      if (id === 'mH' && S.mmode !== 'drop') return;
      rebuild({ keepT: true });
    });
  }
  $$('#panel .chip').forEach((b) => b.addEventListener('click', () => {
    const set = b.dataset.set, key = b.dataset.key, def = CHIPS[set].find((c) => c[0] === key);
    if (set === 'mmode') { S.mmode = key; S.hold = null; rebuild({ fresh: true, x: 0.12 }); return; }
    if (set === 'rmode') { S.rmode = key; S.rodStart = null; rebuild({ fresh: true, x: 0.3 }); return; }
    if (set === 'rdir') { S.rdir = key; rebuild({ keepT: true }); return; }
    for (const [k, v] of Object.entries(def[3])) setSl(k, v);
    if (set === 'rpre') S.rodStart = null;
    rebuild({ keepT: set === 'gspd' || set === 'mmat' || set === 'mcoil' });
  }));
  $('#mClosed').addEventListener('change', () => rebuild({ keepT: true }));
  $('#gComm').addEventListener('change', () => rebuild({ keepT: true }));
  $('#flip').addEventListener('click', () => { S.flip = !S.flip; rebuild({ keepT: true }); });
}
function setScene(sc) {
  if (S.scene === sc) return;
  S.scene = sc; S.hold = null; S.drag = null; S.hoverT = null; tip.hidden = true;
  $$('#scenes .scene').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.scene === sc)));
  if (sc === 'magnet' && S.mmode === 'drag') S.mmode = 'osc';
  if (sc === 'rod' && S.rmode === 'drag') { S.rmode = 'release'; }
  S.rodStart = null;
  RUN = null; S.t = 0; S.paused = true; S.ended = false; S.Qlive = 0; S.qoff = 0; S.qoff2 = 0;
  rebuild(); snapNeedle();
  if (sc === 'rod') S.rodLrView = S.rodLr;
}
$$('#scenes .scene').forEach((b) => b.addEventListener('click', () => setScene(b.dataset.scene)));
$('#pause').addEventListener('click', togglePause);
$('#restart').addEventListener('click', restart);
$('#step-back').addEventListener('click', () => seek(S.t - stepSize()));
$('#step-fwd').addEventListener('click', () => seek(S.t + stepSize()));
$('#scrub').addEventListener('input', (e) => seek(+e.target.value / 1000 * RUN.T));
$$('#speed button').forEach((b) => b.addEventListener('click', () => { S.speed = +b.dataset.sp; $$('#speed button').forEach((x) => x.setAttribute('aria-pressed', String(x === b))); }));
const TOG = { 'tg-lines': 'lines', 'tg-vec': 'vec', 'tg-dots': 'dots', 'tg-lenz': 'lenz' };
Object.entries(TOG).forEach(([id, key]) => $('#' + id).addEventListener('click', (e) => { S[key] = !S[key]; e.currentTarget.setAttribute('aria-pressed', String(S[key])); dirty = true; refreshText(false); drawAll(); }));
$$('#tabs button').forEach((b) => b.addEventListener('click', () => { S.tab = b.dataset.tab; updateChartTabs(); chartDirty = true; }));
const fsBtn = $('#fs');
if (!document.fullscreenEnabled) fsBtn.hidden = true;
function toggleFs() { const st = $('#stage'); if (document.fullscreenElement) document.exitFullscreen().catch(() => {}); else if (st.requestFullscreen) st.requestFullscreen().catch(() => {}); }
fsBtn.addEventListener('click', toggleFs);
document.addEventListener('keydown', (e) => {
  const tag = (e.target.tagName || '').toLowerCase();
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.code === 'Space' && tag !== 'button' && tag !== 'input') { e.preventDefault(); togglePause(); return; }
  if (tag === 'input') return;
  if (e.key === '1') setScene('magnet'); else if (e.key === '2') setScene('rod'); else if (e.key === '3') setScene('gen');
  else if (e.key === 'ArrowLeft' || e.key === ',') { e.preventDefault(); seek(S.t - stepSize()); }
  else if (e.key === 'ArrowRight' || e.key === '.') { e.preventDefault(); seek(S.t + stepSize()); }
  else if (e.key === 'r' || e.key === 'R') restart();
  else if (e.key === 'f' || e.key === 'F') toggleFs();
});
function applyLang() {
  document.documentElement.lang = lang;
  $$('[data-i18n]').forEach((el) => { el.textContent = tr(el.dataset.i18n); });
  $$('[data-i18n-html]').forEach((el) => { el.innerHTML = tr(el.dataset.i18nHtml); });
  $$('.lang button').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.lang === lang)));
  $('#keys').innerHTML = tr('keys');
  $('#sp-01').textContent = lang === 'pl' ? '0,1×' : '0.1×';
  $$('#panel .chip small').forEach((s) => { if (!s.dataset.i18n) s.textContent = lang === 'pl' ? s.textContent.replace(/(\d)\.(\d)/g, '$1,$2') : s.textContent.replace(/(\d),(\d)/g, '$1.$2'); });
  hudScene = ''; lastCo = ''; pauseIcon = '';
  updateOutputs(); updatePanelVis(); refreshText(true); dirty = true; chartDirty = true;
}
$$('.lang button').forEach((b) => b.addEventListener('click', () => { lang = b.dataset.lang; try { localStorage.setItem('indukcja-lang', lang); } catch (e) {} applyLang(); }));
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', readTokens);
new MutationObserver(readTokens).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { dirty = true; chartDirty = true; });

/* ---------- boot: build everything and draw the first frame synchronously ---------- */
buildPanel(); bindPanel();
readTokens(); resize();
LINES = traceLines();
rebuild();
{ let im = 0; for (let i = 0; i < RUN.n / 2; i++) if (Math.abs(RUN.c.I[i]) > Math.abs(RUN.c.I[im])) im = i; S.t = RUN.t[Math.max(0, im - 12)]; }   // open on a strong current pulse
snapNeedle();
applyLang();
drawAll();
started = true;
requestAnimationFrame((t) => { lastT = t; frame(t); });
})();
